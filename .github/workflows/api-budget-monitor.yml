name: API Budget Monitor checks

on:
  push:
    paths:
      - 'apps/api-budget-monitor/**'
      - '.github/workflows/api-budget-monitor.yml'
  pull_request:
    paths:
      - 'apps/api-budget-monitor/**'
      - '.github/workflows/api-budget-monitor.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/api-budget-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py api_budget_monitor
