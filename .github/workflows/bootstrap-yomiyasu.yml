name: Bootstrap pinned yomiyasu

on:
  push:
    branches: [feat/add-yomiyasu]
    paths:
      - .github/workflows/bootstrap-yomiyasu.yml
      - scripts/update_portable_skills.py

permissions:
  contents: write

concurrency:
  group: bootstrap-yomiyasu
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'IsseiMatsuzoe/agent-skill-marketplace' && github.ref == 'refs/heads/feat/add-yomiyasu'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/add-yomiyasu
      - name: Import pinned runtime files and validate
        run: python3 scripts/update_portable_skills.py --write --zip dist/portable-agent-skills-v0.3.0.zip
      - name: Commit only the reviewed plugin and README paths
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins/portable-agent-skills README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Vendor yomiyasu and add exclusive writing-skill selection'
            git push origin HEAD:refs/heads/feat/add-yomiyasu
          fi
      - name: Save upload-ready plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: portable-agent-skills-v0.3.0
          path: dist/portable-agent-skills-v0.3.0.zip
          if-no-files-found: error
          retention-days: 14
